<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Linguistica Italiana · Materiale aggiuntivo — Una Mano Spensierata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,600;1,700;1,900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700&display=swap" rel="stylesheet">
<style>
/* Materiale aggiuntivo di Linguistica Italiana — stesso design system di UMS
   (avorio, navy, oro · Playfair Display + DM Sans · modalità notte condivisa). */
:root{
  --ivory:#F7F4EF; --ivory-dk:#EDE9E0; --card:#FFFDF9; --dust:#E8E4DC; --mist:#C5C1B8;
  --gold:#C8A96E; --gold-lt:#E8D5AA; --gold-dk:#9A7A3F; --navy:#1A2F4F; --navy-lt:#2A4A72;
  --ink:#1C1C22; --body:#3D3C3A; --sub:#7A7770; --blu-it:#2A4A72;
  --ok:#2E7D32; --ko:#C62828;
  --font-display:'Playfair Display',Georgia,serif; --font-body:'DM Sans',system-ui,sans-serif;
  --shadow-card:0 4px 24px rgba(15,17,23,.08),0 1px 4px rgba(15,17,23,.04);
  --shadow-lift:0 12px 40px rgba(15,17,23,.14),0 2px 8px rgba(15,17,23,.06);
  --ease:cubic-bezier(.22,.61,.36,1);
}
body.night-mode{
  --ivory:#14161C; --ivory-dk:#1B1E26; --card:#1C1F27; --dust:#2B2E38; --mist:#5C5F6A;
  --gold-dk:#D9BC85; --gold-lt:#3A3222; --navy:#2A4A72; --navy-lt:#8FB4E8;
  --ink:#F2EFE8; --body:#CFCAC0; --sub:#918E86; --blu-it:#8FB4E8;
  --ok:#7FD39A; --ko:#F08A80;
  --shadow-card:0 4px 24px rgba(0,0,0,.35); --shadow-lift:0 12px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--ivory);color:var(--body);font-family:var(--font-body);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:var(--blu-it)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
img{max-width:100%}
[hidden]{display:none!important}

.pagina{max-width:860px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 120px max(20px,env(safe-area-inset-left,0px))}
.indietro{display:inline-flex;align-items:center;gap:8px;font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);text-decoration:none;transition:gap .2s var(--ease),color .2s}
.indietro:hover{gap:12px;color:var(--navy)}
body.night-mode .indietro:hover{color:var(--navy-lt)}
.indietro svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* intestazione (come il cv-header di UMS) */
.kicker{display:flex;align-items:center;gap:12px;font-size:.66rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-dk)}
.kicker.righe::before,.kicker.righe::after{content:"";height:1px;width:32px;background:var(--gold)}
.kicker.centro{justify-content:center}
h1,h2,h3{font-family:var(--font-display);color:var(--ink);margin:0;text-wrap:balance}
h1{font-weight:900;font-size:clamp(2.3rem,6vw,3.5rem);line-height:1.06;letter-spacing:-.01em;margin-top:14px}
h1 i,h2 i{font-weight:700;color:var(--blu-it)}
h2{font-weight:700;font-size:clamp(1.45rem,3.4vw,1.85rem);line-height:1.15}
h3{font-weight:700;font-size:1.18rem;line-height:1.25}
.sottotitolo{font-size:1.08rem;color:var(--sub);margin:12px 0 0;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:var(--gold-lt);color:var(--gold-dk)}
body.night-mode .chip{color:#D9BC85}
.filetto{border:none;border-top:1px solid var(--dust);margin:28px 0 8px}

/* hero della home */
.hero{text-align:center;padding:40px 0 18px}
.hero h1{font-size:clamp(2.8rem,9vw,4.8rem);margin-top:18px}
.hero h1 .seconda{display:block;font-style:italic;font-weight:700;color:var(--blu-it)}
.hero .sottotitolo{margin:18px auto 0}

/* elenchi a righe (come la vista corso di UMS) */
.sezione{margin-top:46px}
.sezione-testa{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sezione-testa p{margin:6px 0 0;color:var(--sub);font-size:.95rem}
.righe-lista{margin-top:14px;border-top:1px solid var(--dust)}
.riga{display:flex;align-items:center;gap:18px;width:100%;padding:18px 6px;background:none;border:0;border-bottom:1px solid var(--dust);text-align:left;text-decoration:none;color:inherit;transition:background .2s}
.riga:hover{background:var(--ivory-dk)}
.riga .num{font-family:var(--font-display);font-weight:900;font-size:1.9rem;min-width:46px;text-align:center;color:var(--dust);line-height:1;transition:color .2s}
.riga:hover .num,.riga.vista .num{color:var(--gold)}
.riga .corpo{flex:1;min-width:0}
.riga .tit{display:block;font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--ink);line-height:1.25}
.riga .desc{display:block;font-size:.92rem;color:var(--sub);margin-top:3px;line-height:1.45}
.riga .stato{display:block;font-size:.7rem;font-weight:600;color:var(--gold-dk);margin-top:5px}
.riga .stato.vuoto{color:var(--mist);font-weight:500}
.riga .freccia{color:var(--mist);transition:transform .2s var(--ease),color .2s}
.riga:hover .freccia{color:var(--gold-dk);transform:translateX(3px)}
.riga .freccia svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.nota-box{margin-top:40px;padding:20px 22px;border-radius:16px;background:var(--ivory-dk);font-size:.95rem}
.nota-box strong{color:var(--ink)}

/* barra fissa: schede + stampa */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 0;margin-top:22px;background:var(--ivory);border-bottom:1px solid var(--dust)}
.schede{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--ivory-dk);flex-wrap:wrap}
.schede button{border:0;background:none;padding:9px 18px;border-radius:999px;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--sub)}
.schede button[aria-selected="true"]{background:var(--navy);color:#F7F4EF;box-shadow:0 4px 14px rgba(26,47,79,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:999px;border:0;font-weight:700;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;transition:transform .2s var(--ease),box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn-navy{background:var(--navy);color:#F7F4EF;box-shadow:0 6px 20px rgba(26,47,79,.28)}
.btn-oro{background:var(--gold);color:#1C1C22;box-shadow:0 6px 20px rgba(200,169,110,.32)}
.btn-chiaro{background:var(--card);color:var(--ink);border:1px solid var(--dust)}
.btn-chiaro:hover{border-color:var(--gold)}
.btn-piccolo{padding:9px 16px;font-size:.68rem}

/* guida alla lezione */
.guida{margin-top:34px}
.blocco{display:grid;grid-template-columns:48px 1fr;gap:6px 14px;padding:22px 0;border-bottom:1px solid var(--dust)}
.blocco:last-child{border-bottom:0}
.blocco .n{font-family:var(--font-display);font-weight:900;font-size:1.9rem;color:var(--gold);line-height:1;text-align:center;padding-top:2px}
.blocco h3{font-size:1.22rem}
.blocco p{margin:8px 0 0;max-width:66ch}
.vai-slide{display:inline-flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.vai-slide button{border:1px solid var(--dust);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.74rem;font-weight:700;color:var(--blu-it)}
.vai-slide button:hover{border-color:var(--gold)}

/* slide */
.slide-testa{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:48px;flex-wrap:wrap}
.slide-flusso{display:flex;flex-direction:column;gap:26px;margin-top:20px}
.slide{margin:0;scroll-margin-top:84px}
.slide button{position:relative;display:block;width:100%;padding:0;border:1px solid var(--dust);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow-card);cursor:zoom-in;transition:box-shadow .2s,transform .2s var(--ease)}
.slide button:hover{box-shadow:var(--shadow-lift)}
.slide img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#fff}
.slide .tag{position:absolute;left:12px;top:12px;font-size:.66rem;font-weight:700;letter-spacing:.12em;padding:4px 10px;border-radius:999px;background:rgba(26,47,79,.88);color:#F7F4EF}
.slide.lampeggia button{box-shadow:0 0 0 3px var(--gold),var(--shadow-lift)}

/* riquadro scuro (come "Dritti al sodo") */
.scuro{margin-top:44px;padding:28px;border-radius:22px;background:#1A2F4F;color:#E9E4DA}
body.night-mode .scuro{background:#1F2B40}
.scuro .kicker{color:var(--gold)}
.scuro h2{color:#F7F4EF;margin-top:8px;font-size:1.5rem}
.scuro ul{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.scuro li{display:grid;grid-template-columns:18px 1fr;gap:10px}
.scuro li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:10px}
.prosegui{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:30px;padding:22px 24px;border-radius:18px;border:1px solid var(--gold);background:var(--card)}

/* mappa del canale scritto */
.mappa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin-top:18px}
.mappa article{padding:20px;border-radius:16px;background:var(--card);border:1px solid var(--dust);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:8px}
.mappa p{margin:0;font-size:.93rem;color:var(--sub);line-height:1.55;flex:1}
.mappa button{align-self:flex-start;border:0;background:none;padding:0;font-size:.78rem;font-weight:700;color:var(--blu-it)}

/* attività e esercizi */
.scheda{margin-top:26px;padding:26px;border-radius:20px;background:var(--card);border:1px solid var(--dust);box-shadow:var(--shadow-card)}
.scheda>h3{font-size:1.3rem}
.fonte{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:.84rem;color:var(--sub)}
.fonte button{border:0;background:none;padding:0;font-size:.84rem;font-weight:700;color:var(--blu-it)}
ol.passi{margin:14px 0 0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:10px}
ol.passi li{counter-increment:p;display:grid;grid-template-columns:30px 1fr;gap:10px}
ol.passi li::before{content:counter(p);font-family:var(--font-display);font-weight:900;color:var(--gold);font-size:1.15rem;line-height:1.5}
.articolo{white-space:pre-wrap;margin-top:16px;padding:20px;border-radius:14px;background:var(--ivory-dk);font-size:.98rem;line-height:1.75;max-height:460px;overflow:auto}
.articolo small{display:block;margin-top:10px;color:var(--sub)}
.avviso{margin-top:16px;padding:12px 16px;border-radius:12px;background:var(--ivory-dk);font-size:.9rem;color:var(--sub)}
.campo{margin-top:20px}
.campo label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:700;font-size:.92rem;color:var(--ink)}
.conta{font-size:.72rem;font-weight:700;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.conta.ok{color:var(--ok)} .conta.ko{color:var(--ko)}
textarea,input[type=text]{width:100%;margin-top:8px;padding:14px 16px;border:1px solid var(--dust);border-radius:14px;background:var(--ivory);color:var(--ink);font:inherit;font-size:16px;line-height:1.65;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-lt)}
.nomi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 16px}
.controlli{margin-top:24px;padding-top:18px;border-top:1px solid var(--dust)}
.spunta{display:flex;gap:12px;align-items:flex-start;padding:7px 0;cursor:pointer}
.spunta input{width:19px;height:19px;margin-top:4px;flex:none;accent-color:#2A4A72}
.azioni{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:24px}
.salvataggio{font-size:.78rem;color:var(--sub)}
.salvataggio b{color:var(--ok)}

.es{margin-top:16px;border-radius:20px;background:var(--card);border:1px solid var(--dust);box-shadow:var(--shadow-card);overflow:hidden}
.es>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:16px;padding:20px 22px}
.es>summary::-webkit-details-marker{display:none}
.es>summary .n{font-family:var(--font-display);font-weight:900;font-size:1.7rem;color:var(--gold);min-width:30px}
.es>summary .t{flex:1;min-width:0}
.es>summary .t span{display:block;font-size:.85rem;color:var(--sub);margin-top:2px}
.es>summary .freccia{color:var(--mist);transition:transform .25s var(--ease)}
.es>summary .freccia svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;display:block}
.es[open]>summary .freccia{transform:rotate(90deg)}
.es .dentro{padding:0 22px 26px;display:flex;flex-direction:column;gap:20px}
.etichetta{font-size:.64rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:6px}
.testo-es{white-space:pre-wrap;padding:18px;border-radius:14px;background:var(--ivory-dk);font-size:.97rem;line-height:1.7}
ul.punti{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.apri{border:1px solid var(--dust);border-radius:14px;overflow:hidden}
.apri>summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:700;color:var(--blu-it);display:flex;justify-content:space-between;gap:10px}
.apri>summary::-webkit-details-marker{display:none}
.apri>summary::after{content:"+";font-size:1.2rem;line-height:1}
.apri[open]>summary::after{content:"–"}
.apri>div{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.soluz{white-space:pre-wrap;padding:16px;border-radius:12px;border:1px dashed var(--gold);font-size:.96rem;line-height:1.7}

/* GISCEL */
.tesi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin-top:18px}
.tesi article{padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--dust)}
.tesi .rom{font-family:var(--font-display);font-weight:900;font-size:1.6rem;color:var(--gold)}
.tesi h3{font-size:1rem;margin-top:2px}
.tesi p{margin:6px 0 8px;font-size:.9rem;color:var(--sub);line-height:1.5}
.tesi a{font-size:.78rem;font-weight:700}
.richiamo{margin-top:22px;padding:20px 22px;border-left:3px solid var(--gold);background:var(--card);border-radius:0 16px 16px 0}
.richiamo p{margin:6px 0 0}
.caso{margin-top:20px;padding:24px;border-radius:20px;background:var(--card);border:1px solid var(--dust)}
.caso blockquote{margin:14px 0;padding:14px 18px;border-left:3px solid var(--gold);background:var(--ivory-dk);border-radius:0 12px 12px 0;font-style:italic}
.testo-lungo p,.testo-lungo ol,.testo-lungo ul{margin:14px 0 0;max-width:68ch}
.testo-lungo ol,.testo-lungo ul{padding-left:22px;display:flex;flex-direction:column;gap:6px}

/* passi della consegna */
.passi-consegna{list-style:none;padding:0;margin:20px 0 0;counter-reset:c;display:flex;flex-direction:column;gap:12px}
.passi-consegna li{counter-increment:c;display:grid;grid-template-columns:46px 1fr;gap:14px;padding:18px 20px;border-radius:16px;background:var(--card);border:1px solid var(--dust)}
.passi-consegna li::before{content:counter(c);font-family:var(--font-display);font-weight:900;font-size:1.8rem;color:var(--gold);line-height:1}

/* tasto notte (come UMS) */
#notte{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:50;width:48px;height:48px;border-radius:50%;border:0;background:#FFFDF9;box-shadow:var(--shadow-lift);font-size:20px;display:grid;place-items:center}
body.night-mode #notte{background:#2B2E38}

/* visore slide */
#visore{position:fixed;inset:0;z-index:200;background:rgba(10,12,18,.94);display:flex;align-items:center;justify-content:center;padding:calc(60px + env(safe-area-inset-top,0px)) 14px calc(76px + env(safe-area-inset-bottom,0px))}
#visore img{max-width:min(1440px,100%);max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
#visore .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px}
#visore .nav{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;align-items:center;gap:16px;color:#fff;font-size:.9rem;font-variant-numeric:tabular-nums}
#visore .nav button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px}

@media (max-width:600px){
  body{font-size:16.5px}
  .blocco{grid-template-columns:34px 1fr}
  .blocco .n{font-size:1.5rem}
  .scheda{padding:20px}
  .barra{gap:8px}
  .schede button{padding:8px 14px}
}

/* stampa: si stampa solo il contenitore preparato apposta */
#area-stampa{display:none}
@media print{
  @page{size:A4;margin:16mm 15mm}
  body{background:#fff!important;color:#222!important;font-size:11pt;line-height:1.55}
  body.in-stampa > *:not(#area-stampa){display:none!important}
  #area-stampa{display:block!important;color:#222}
  #area-stampa .p-marchio{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #C8A96E;padding-bottom:6px;margin-bottom:16px;font-size:9pt;color:#9A7A3F;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
  #area-stampa .p-marchio b{font-family:var(--font-display);font-size:13pt;letter-spacing:0;text-transform:none;color:#1C1C22}
  #area-stampa .p-marchio b i{color:#2A4A72}
  #area-stampa h1{font-size:24pt;color:#1C1C22;margin:4px 0 6px}
  #area-stampa h2{font-size:15pt;color:#1C1C22;margin:18px 0 6px;break-after:avoid}
  #area-stampa h3{font-size:12pt;color:#1C1C22;margin:12px 0 4px;break-after:avoid}
  #area-stampa .p-kick{font-size:8pt;letter-spacing:.2em;text-transform:uppercase;color:#9A7A3F;font-weight:700}
  #area-stampa .p-sub{color:#666;margin:0 0 8px}
  #area-stampa p{margin:4px 0 8px}
  #area-stampa .p-blocco{break-inside:avoid;margin-bottom:8px}
  #area-stampa .p-box{border:1px solid #ddd;border-radius:6px;padding:8px 10px;white-space:pre-wrap;background:#FAF8F4;margin:4px 0 10px}
  #area-stampa .p-righe{height:var(--h);background:repeating-linear-gradient(to bottom,transparent 0,transparent 8.5mm,#ccc 8.5mm,#ccc 8.7mm);margin:4px 0 12px}
  #area-stampa .p-slide{break-inside:avoid;margin:0 0 7mm}
  #area-stampa .p-slide img{width:100%;border:1px solid #ddd;display:block}
  #area-stampa .p-slide span{font-size:8pt;color:#777}
  #area-stampa .p-salto{break-before:page}
  #area-stampa ul,#area-stampa ol{margin:4px 0 10px;padding-left:18px}
}
</style>
</head>
<body>

    articolo: "Appassionato di computer, è riuscito a localizzare l'iPhone che gli era stato rubato e ha fatto arrestare i due ladri che avevano svaligiato l'appartamento dove vive coi genitori. Un'indagine telematica quella di Giacomo, 15 anni, studente di un liceo di Monteverde che, seguendo la traccia del Gps, ha portato gli uomini del vicequestore Mario Viola fino a un casolare sulla Cassia dove i due, M.B., italiano, e D.K., albanese, si erano rifugiati. Gli agenti hanno recuperato anche la refurtiva di altri colpi messi a segno, nella zona, dalla coppia di ladri.\n«Ad accorgersi del furto è stato mio zio, che è venuto a trovarci e ha trovato la porta aperta – racconta Giacomo, un ragazzo che, oltre alla tecnologia, ha la passione delle moto anche se, per ora, deve accontentarsi di un modesto “cinquantino”. Noi dormivamo tutti e i ladri si erano portati via un pc, un iPhone e circa 300 euro in contanti. I due cani non hanno neanche abbaiato. Fatto sta che, mentre mia madre andava al commissariato a sporgere denuncia, io ho attivato, da un altro tablet (che non era stato rubato perché era custodito in un cassetto del mio comodino) la funzione che serve a localizzare il dispositivo e che avevo istallato in precedenza. L'iPhone era a una quindicina di chilometri di distanza, in un casolare abusivo sulla Cassia che non risultava nemmeno sulle mappe. Ho portato tutto al commissariato e gli agenti hanno deciso di andare sul posto».\nIl vicequestore Viola e i suoi uomini sono arrivati sulla Cassia in mattinata ma il casolare era deserto. La seconda volta, si sono portati dietro Giacomo, emozionatissimo, che sfoggiava un cappellino della polizia e si sentiva perfettamente calato nella parte: un detective di 15 anni. Il ruolo del ragazzo, in realtà, è stato decisivo perché il giovane ha attivato, a distanza, un comando che ha fatto suonare l'iPhone, nascosto tra il letto e la parete della stanza dove si trovava il ladro italiano. L'uomo è finito subito in manette e, nella perquisizione successiva, è saltato fuori anche il resto della refurtiva. Il complice albanese è stato rintracciato e ammanettato qualche ora dopo e a questo punto Giacomo si era già guadagnato abbondantemente la nomina a poliziotto onorario.\n«In realtà è stato abbastanza semplice, oggi chiunque attiva la funzione di localizzazione – minimizza l'adolescente che, come tutti i coetanei, non capisce le difficoltà tecnologiche di chi ha imparato a scrivere con penna e calamaio –. Io ho solo pensato di fare più in fretta possibile e gli agenti del commissariato, gentilissimi, mi hanno dato retta». La bravura del quindicenne col computer, probabilmente, servirà anche a risolvere altri casi di furto in cui i due arrestati erano stati coinvolti in passato. Quanto a Giacomo, l'adolescente sostiene di non essere poi un gran che, alla tastiera del pc («appassionato è un parolone, me la cavo, tutto qui»), ma in futuro ha già deciso di studiare informatica.",

      guida: "Autobus perso dopo il recupero della cartellina, bicicletta prestata, pioggia e appunti rovinati, presentazione attraverso le immagini e consapevolezza finale costituiscono la sequenza. Non inventare l'esito della valutazione della commissione.",
      rilancio: "Riscrivi il riassunto in 35–45 parole. Conserva il cambiamento finale nella percezione della protagonista, senza formulare una morale.",
      analisi: "E: ritardo dovuto al recupero dei disegni; scelta della bicicletta; pioggia e appunti illeggibili; esposizione attraverso le immagini; nuova consapevolezza. I: commissione ancora occupata. M nella sintesi: telefonata al fratello e riordino dei disegni, se non necessari a spiegare la sequenza.",
      soluzioni: [{ t: "Riassunto del racconto · 58 parole", x: "Marta perde l'autobus dopo essere tornata a prendere i disegni per una presentazione. Ottiene in prestito una bicicletta e raggiunge la sede sotto la pioggia, mentre la commissione è ancora occupata. Al momento di parlare trova gli appunti quasi illeggibili e decide di seguire le immagini. Dopo l'esposizione, capisce di conoscere il proprio progetto meglio di quanto pensasse." }],
      commento: "Il riassunto conserva le decisioni della protagonista e il cambiamento finale. Non afferma che la commissione abbia approvato il progetto: il racconto non lo dice.",
      extra: "Versione più breve: «Dopo aver perso l'autobus, Marta raggiunge in bicicletta una presentazione sotto la pioggia. Gli appunti rovinati la costringono a esporre seguendo i disegni. Al termine si accorge di conoscere il progetto meglio di quanto credesse». Il cambiamento è riferito alla sua percezione, non alla valutazione esterna." }
  ],
  argomentativo: [
    { titolo: "Individuare e valutare", tempo: "25 minuti", obiettivo: "Riconoscere una tesi e valutare la pertinenza del suo sostegno.",
      testo: "I manuali del corso dovrebbero essere disponibili anche in formato digitale accessibile. Un file ben strutturato permette di cercare termini e di adattare la visualizzazione alle esigenze del lettore. Per esempio, una studentessa può ingrandire i caratteri senza perdere l'ordine dei paragrafi. Si potrebbe obiettare che leggere a lungo su schermo affatica e rende più difficile annotare. L'obiezione sostiene l'utilità di mantenere il cartaceo, ma non giustifica l'assenza di un'alternativa digitale. Tutti imparano meglio con i file, perché la tecnologia è il futuro. Offrire entrambi i formati consentirebbe invece di scegliere in base al compito e alle esigenze personali.",
      consegna: "Individua tesi, argomenti, esempio, obiezione e risposta. Spiega perché una frase indebolisce il ragionamento e riscrivila senza generalizzazioni. Proponi un titolo che mostri la posizione.",
      prima: ["Distingui la proposta di affiancare il digitale al cartaceo da quella di sostituirlo.", "Segna con etichette diverse argomento, esempio, obiezione e risposta.", "Individua il passaggio che estende a tutti un beneficio non dimostrato."],
      revisione: ["La frase riscritta sostiene ancora la tesi, ma con una portata più precisa?", "Hai distinto un esempio plausibile da una prova generale?", "Il titolo esprime la posizione senza renderla più radicale?"],
      guida: "La tesi riguarda un'alternativa digitale accessibile, non l'abolizione della carta. L'esempio illustra una possibilità, non dimostra un vantaggio per tutti. La frase sull'apprendimento universale e sul futuro richiede revisione.",
      rilancio: "Scrivi un'obiezione più forte di quella presente nel testo e una risposta di 60–80 parole. Non limitarti a liquidare l'obiezione come sbagliata.",
      analisi: "Tesi: affiancare ai manuali cartacei una versione digitale accessibile. Argomento: ricerca nel testo e adattamento della visualizzazione. Esempio: ingrandimento dei caratteri. Obiezione: affaticamento e difficoltà di annotazione. Risposta: queste ragioni sostengono il mantenimento della carta, non l'esclusione del digitale.",
      soluzioni: [{ t: "Titolo e revisione del passaggio debole", x: "Titolo: Manuali accessibili: offrire una scelta, ampliare le possibilità\n\nAl posto di «Tutti imparano meglio con i file, perché la tecnologia è il futuro»: «Una versione digitale accessibile può rispondere a esigenze di lettura diverse e affiancare utilmente il manuale cartaceo; la scelta del supporto dipende anche dal compito e dalle preferenze del lettore»." }],
      commento: "La nuova frase elimina sia la generalizzazione sull'apprendimento sia l'appello generico al futuro. Conserva una ragione pertinente alla tesi senza presentarla come risultato sperimentale.",
      extra: "Obiezione e risposta: «Predisporre una versione digitale accessibile richiede lavoro e competenze: un semplice file non garantisce accessibilità. L'obiezione è pertinente e impone di definire requisiti e responsabilità. Tuttavia, non dimostra che l'alternativa digitale sia inutile. Si può prevedere un'introduzione graduale, cominciando dai materiali più utilizzati e verificandone la fruibilità con chi li consulta. La proposta riguarda dunque la qualità dell'offerta, non la sola presenza di un file»." },
    { titolo: "Prenotare un posto in biblioteca", tempo: "40 minuti", obiettivo: "Costruire una proposta tenendo conto di esigenze in conflitto.",
      testo: "Durante la sessione d'esami trovare un posto in biblioteca può richiedere tempo. Chi arriva in treno vorrebbe sapere, prima di partire, se potrà sedersi. Altri studenti entrano solo per un'ora, tra due lezioni, e preferiscono l'accesso libero. La prenotazione potrebbe aiutare a organizzarsi, ma una postazione prenotata e non occupata rimarrebbe inutilizzata.\n\nLa biblioteca dovrebbe rendere prenotabile una parte dei posti? Valuta anche come gestire ritardi, rinunce e accesso senza prenotazione.",
      consegna: "Formula una tesi precisa. Prepara una scaletta con due argomenti, un'obiezione e una risposta. Scrivi 220–280 parole e scegli un titolo. Segnala nel testo eventuali ipotesi e, alla fine, indica quali dati raccoglieresti per verificare la proposta.",
      min: 220, max: 280,
      prima: ["Individua chi trae vantaggio dalla prenotazione e chi potrebbe esserne penalizzato.", "Distingui gli effetti possibili dai risultati che richiederebbero dati.", "Formula una tesi delimitata: quali posti, quali regole, quali eccezioni?"],
      revisione: ["Ogni argomento spiega perché la proposta sarebbe utile o problematica?", "L'obiezione rappresenta correttamente un'esigenza diversa dalla tua?", "Hai evitato percentuali, sondaggi o risultati non disponibili?"],
      guida: "Sono sostenibili posizioni diverse. Una proposta convincente considera sia chi deve programmare il viaggio sia chi usa la biblioteca per brevi periodi. Se proponi una sperimentazione o un limite di tempo per occupare il posto, spiega a quale problema rispondono. Distingui gli effetti attesi dai risultati da verificare.",
      rilancio: "Riduci il testo a una proposta di 100–120 parole per i rappresentanti degli studenti: mantieni la decisione richiesta, la ragione principale e una condizione di attuazione.",
      analisi: "Tesi: sperimentare una quota prenotabile, mantenendo accesso libero. Argomento 1: programmare il viaggio. Argomento 2: conciliare usi differenti. Obiezione: prenotazioni inutilizzate. Risposta: conferma all'arrivo, rinuncia semplice e rilascio del posto. I risultati restano da verificare.",
      soluzioni: [{ t: "Una possibile argomentazione · 253 parole", x: "Posti in biblioteca: prenotare una parte, garantire accesso libero\n\nLa biblioteca universitaria dovrebbe sperimentare la prenotazione di una parte dei posti, mantenendone altri ad accesso libero. Una soluzione mista potrebbe conciliare le esigenze di chi programma una giornata di studio e di chi entra per un intervallo breve.\nPer gli studenti che arrivano in treno, sapere di avere una postazione renderebbe più prevedibile l'organizzazione del viaggio. Questo vantaggio non dimostra che tutti userebbero il servizio, ma identifica un bisogno al quale la prenotazione potrebbe rispondere.\nD'altra parte, chi ha un'ora libera tra due lezioni deve poter accedere senza pianificare ogni spostamento. Per questo sarebbe poco opportuno riservare tutti i posti: la quota libera tutelerebbe un uso diverso, ma altrettanto legittimo, della biblioteca.\nL'obiezione più forte riguarda le prenotazioni inutilizzate. Se un posto rimanesse vuoto mentre altri studenti aspettano, il sistema peggiorerebbe l'accesso. Occorrerebbe quindi prevedere la conferma all'arrivo, un tempo massimo di attesa e una procedura semplice per rinunciare. Le modalità andrebbero comunicate chiaramente prima dell'avvio.\nLa proposta dovrebbe essere verificata durante un periodo di prova. Sarebbe utile raccogliere dati sull'occupazione effettiva, sulle rinunce e sulle richieste rimaste insoddisfatte, ascoltando anche chi preferisce l'accesso libero. Prima di fissare le quote, andrebbero inoltre considerate le diverse fasce orarie, perché il bisogno di posti può variare durante la giornata.\nPrenotare una parte dei posti sarebbe dunque una scelta ragionevole solo se accompagnata da regole comprensibili e dalla possibilità di correggerle. Lo scopo è utilizzare meglio gli spazi, non introdurre un vincolo fine a sé stesso." }],
      commento: "La tesi delimita la proposta. I vantaggi sono formulati come possibilità, l'obiezione riceve una risposta concreta e la sperimentazione non viene presentata come già riuscita.",
      extra: "Proposta ai rappresentanti: «Chiediamo di sperimentare la prenotazione di una parte dei posti in biblioteca, mantenendo una quota ad accesso libero. Chi arriva da lontano potrebbe così organizzare il viaggio sapendo di avere una postazione, mentre chi entra tra due lezioni conserverebbe la possibilità di accedere senza prenotare. Per evitare posti inutilizzati, proponiamo una conferma all'arrivo e il rilascio delle prenotazioni non confermate entro un intervallo stabilito. La rinuncia dovrebbe essere semplice e immediata. Al termine della prova, andrebbero esaminati occupazione effettiva, rinunce e richieste insoddisfatte, raccogliendo anche le osservazioni degli studenti. Chiediamo quindi di discutere modalità e durata della sperimentazione prima di estendere il servizio». La sintesi conserva proposta, motivazione, condizioni e verifica." },
    { titolo: "Lezioni registrate e partecipazione", tempo: "40 minuti", obiettivo: "Confrontare posizioni senza attribuire loro affermazioni che non contengono.",
      testo: "A: «Le registrazioni delle lezioni dovrebbero restare disponibili per tutto il semestre. Quando riascolto un passaggio difficile posso fermarmi, controllare gli appunti e ripartire. Sono utili anche se perdo un incontro.»\n\nB: «Riascoltare è utile, ma la registrazione non dovrebbe diventare un sostituto della partecipazione. In aula le domande e il confronto cambiano il modo in cui si sviluppa la lezione: il video non restituisce tutta questa esperienza.»",
      consegna: "Spiega se le posizioni sono necessariamente incompatibili. Poi scrivi un testo di 220–280 parole con una tua tesi sull'uso delle registrazioni, due argomenti, un'obiezione e una risposta. Distingui esempi possibili da prove e chiudi con una conclusione coerente.",
      min: 220, max: 280,
      prima: ["Riformula ciascuna posizione in una frase neutra, prima di esprimere il tuo giudizio.", "Distingui la disponibilità delle registrazioni dal valore della partecipazione.", "Individua un punto di accordo e una questione che rimane aperta."],
      revisione: ["Hai evitato di attribuire ad A l'inutilità della frequenza e a B un divieto assoluto?", "La tua tesi precisa come usare le registrazioni?", "La conclusione deriva dagli argomenti e non aggiunge una nuova tesi?"],
      guida: "Le posizioni possono coesistere: disponibilità delle registrazioni e valore della partecipazione riguardano aspetti diversi. Evita di attribuire a B un divieto assoluto o ad A l'inutilità della frequenza. Sono ammesse tesi diverse se sostenute.",
      rilancio: "Scrivi una conclusione alternativa che introduca una concessione alla posizione opposta. Spiega se la concessione indebolisce o rende più precisa la tua tesi.",
      analisi: "A sostiene la disponibilità delle registrazioni; B difende il valore della partecipazione. Le posizioni non si escludono necessariamente. Restano da discutere funzione delle registrazioni, forme di accesso e rapporto con le attività svolte in presenza.",
      soluzioni: [{ t: "Una possibile argomentazione · 253 parole", x: "Registrare le lezioni per integrare la partecipazione\n\nLe registrazioni dovrebbero restare disponibili durante il semestre come supporto allo studio. Questa scelta può convivere con il riconoscimento del valore della partecipazione, purché sia chiaro che riascoltare e intervenire in aula sono attività diverse.\nUn primo argomento riguarda il lavoro sui passaggi difficili. Una registrazione permette di fermarsi, confrontare quanto ascoltato con gli appunti e riprendere un ragionamento. Non ne consegue che garantisca una comprensione migliore a chiunque: offre però una possibilità concreta di controllo del proprio studio.\nUn secondo argomento riguarda la continuità. Chi perde un incontro può ricostruire almeno una parte del percorso della lezione. Per esempio, potrebbe utilizzare il video per individuare i concetti da approfondire e arrivare all'incontro successivo con domande precise. Si tratta di un uso possibile, non di un risultato che possiamo dare per acquisito.\nSi può obiettare che la disponibilità del video incoraggi a rinunciare alla frequenza. Il problema merita attenzione, ma non rende incompatibili accesso alle registrazioni e partecipazione. La docente potrebbe chiarire quali attività richiedono confronto e produzione condivisa, rendendo riconoscibile ciò che il video non sostituisce.\nAnche gli studenti avrebbero una responsabilità: organizzare il riascolto, selezionare i dubbi e non limitarsi ad accumulare lezioni da recuperare alla fine. Il materiale sarebbe utile nella misura in cui entrasse in un metodo di studio attivo.\nLa disponibilità delle registrazioni andrebbe quindi accompagnata da indicazioni sul loro uso. Difendere la partecipazione non impone di rinunciare al riascolto; richiede piuttosto di spiegare che cosa ciascuna modalità permette di fare." }],
      commento: "Il testo riconosce il punto di accordo, considera l'obiezione e distingue possibilità, esempi e risultati. Non attribuisce a nessuna delle due posizioni una tesi estrema.",
      extra: "Conclusione con concessione: «Anche ammettendo che qualcuno possa usare le registrazioni per rinviare lo studio, il riascolto resta una risorsa utile. Perciò ne sosterrei la disponibilità, accompagnata da attività e indicazioni che favoriscano un uso regolare». La concessione restringe la tesi e ne esplicita le condizioni." }
  ]
};

</script>
<script>
(function(){
const app = document.getElementById('app');
const HOME_UMS = '../../index.html';

/* ---------- memoria nel browser ---------- */
const mem = {
  get(k, d){ try { const v = localStorage.getItem('ums_ling_' + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('ums_ling_' + k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- notte (stessa chiave di UMS) ---------- */
const btnNotte = document.getElementById('notte');
const segnaNotte = () => { const on = document.body.classList.contains('night-mode'); btnNotte.textContent = on ? '☀️' : '🌙'; };
segnaNotte();
btnNotte.onclick = () => {
  const on = !document.body.classList.contains('night-mode');
  document.body.classList.toggle('night-mode', on);
  try { localStorage.setItem('ums_night_mode', on ? '1' : '0'); } catch(e){}
  segnaNotte();
};

/* ---------- utilità ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parole = t => (t || '').trim().split(/\s+/).filter(Boolean).length;
const pad = n => String(n).padStart(2, '0');
const src = (deck, n) => 'slide/' + deck + '-' + pad(n) + '.jpg';
const FRECCIA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const INDIETRO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>';
const STAMPA_ICO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg>';
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function fraseVisita(iso){ const d = new Date(iso + 'T00:00:00'); const g = d.getDate(); return 'visitata ' + ((g === 8 || g === 11) ? "l'" : 'il ') + g + ' ' + MESI[d.getMonth()]; }
function segnaVisita(k){ const v = mem.get('visite', {}); const o = new Date(); v[k] = o.getFullYear() + '-' + pad(o.getMonth() + 1) + '-' + pad(o.getDate()); mem.set('visite', v); }
const intervalli = r => !r ? [] : (Array.isArray(r[0]) ? r : [r]);
const etichettaIntervallo = ([a, b]) => a === b ? 'Slide ' + a : 'Slide ' + a + '–' + b;

/* ---------- visore delle slide ---------- */
const visore = document.getElementById('visore'), vImg = document.getElementById('v-img'), vN = document.getElementById('v-n');
let vDeck = null, vTot = 0, vI = 1;
function vMostra(){ vImg.src = src(vDeck, vI); vImg.alt = 'Slide ' + vI; vN.textContent = 'Slide ' + vI + ' di ' + vTot; }
function apriVisore(deck, tot, n){ vDeck = deck; vTot = tot; vI = n; vMostra(); visore.hidden = false; document.body.style.overflow = 'hidden'; document.getElementById('v-x').focus(); }
function chiudiVisore(){ visore.hidden = true; document.body.style.overflow = ''; }
document.getElementById('v-x').onclick = chiudiVisore;
document.getElementById('v-p').onclick = () => { vI = vI > 1 ? vI - 1 : vTot; vMostra(); };
document.getElementById('v-s').onclick = () => { vI = vI < vTot ? vI + 1 : 1; vMostra(); };
visore.addEventListener('click', e => { if (e.target === visore) chiudiVisore(); });
document.addEventListener('keydown', e => {
  if (visore.hidden) return;
  if (e.key === 'Escape') chiudiVisore();
  if (e.key === 'ArrowLeft') document.getElementById('v-p').click();
  if (e.key === 'ArrowRight') document.getElementById('v-s').click();
});
let sx = null;
visore.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
visore.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) document.getElementById(dx < 0 ? 'v-s' : 'v-p').click(); sx = null; });

function flussoSlide(deck, tot){
  let h = '<div class="slide-flusso">';
  for (let i = 1; i <= tot; i++) h += `<figure class="slide" id="slide-${i}"><button type="button" data-v="${i}" aria-label="Apri la slide ${i} a schermo intero"><img src="${src(deck, i)}" alt="Slide ${i}" loading="lazy" width="1440" height="810"><span class="tag">${i} / ${tot}</span></button></figure>`;
  return h + '</div>';
}
function collegaSlide(deck, tot){
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => apriVisore(deck, tot, +b.dataset.v));
  app.querySelectorAll('[data-vai]').forEach(b => b.onclick = () => vaiASlide(+b.dataset.vai));
  app.querySelectorAll('[data-guarda]').forEach(b => b.onclick = () => apriVisore(deck, tot, +b.dataset.guarda));
}
function vaiASlide(n){
  const el = document.getElementById('slide-' + n);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.add('lampeggia'); setTimeout(() => el.classList.remove('lampeggia'), 1600);
}

/* ---------- stampa (finestra di stampa del browser) ---------- */
const areaStampa = document.getElementById('area-stampa');
const MARCHIO = '<div class="p-marchio"><b>Una Mano <i>Spensierata</i></b><span>Linguistica Italiana · Materiale aggiuntivo</span></div>';
function stampa(html){
  areaStampa.innerHTML = MARCHIO + html;
  document.body.classList.add('in-stampa');
  const imgs = [...areaStampa.querySelectorAll('img')];
  Promise.all(imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))).then(() => setTimeout(() => window.print(), 60));
}
addEventListener('afterprint', () => { document.body.classList.remove('in-stampa'); areaStampa.innerHTML = ''; });
const pSlide = (deck, a, b) => { let h = ''; for (let i = a; i <= b; i++) h += `<div class="p-slide"><img src="${src(deck, i)}" alt=""><span>Slide ${i}</span></div>`; return h; };
const pTesto = v => v && v.trim() ? `<div class="p-box">${esc(v)}</div>` : '';
const pRighe = n => `<div class="p-righe" style="--h:${Math.max(3, n) * 8.7}mm"></div>`;

/* ---------- campi di scrittura ---------- */
function contatore(t, ob){
  const n = parole(t);
  if (ob > 0) return { t: n + ' / ' + ob + ' parole', c: n === 0 ? '' : n === ob ? 'ok' : n > ob ? 'ko' : '' };
  if (ob < 0) return { t: n + ' / max ' + (-ob) + ' parole', c: n === 0 ? '' : n <= -ob ? 'ok' : 'ko' };
  return { t: n + ' parole', c: '' };
}
function contatoreMinMax(t, min, max){
  const n = parole(t);
  if (!min) return { t: n + ' parole', c: '' };
  return { t: n + ' parole · ' + min + '–' + max, c: n === 0 ? '' : (n >= min && n <= max ? 'ok' : 'ko') };
}
function collegaCampi(radice, salvato){
  radice.querySelectorAll('textarea[data-k], input[type=text][data-k]').forEach(el => {
    el.value = mem.get(el.dataset.k, '');
    const out = radice.querySelector('[data-conta="' + el.dataset.k + '"]');
    const agg = () => {
      if (!out) return;
      const r = el.dataset.min ? contatoreMinMax(el.value, +el.dataset.min, +el.dataset.max) : contatore(el.value, +el.dataset.ob || 0);
      out.textContent = r.t; out.className = 'conta ' + r.c;
    };
    agg();
    el.addEventListener('input', () => { mem.set(el.dataset.k, el.value); agg(); salvato && salvato(); });
  });
  radice.querySelectorAll('input[type=checkbox][data-k]').forEach(cb => {
    cb.checked = !!mem.get(cb.dataset.k, false);
    cb.addEventListener('change', () => { mem.set(cb.dataset.k, cb.checked); salvato && salvato(); });
  });
}

/* ================= HOME ================= */
function home(){
  const v = mem.get('visite', {});
  const riga = (n, href, tit, desc, chiave) => `<a class="riga ${v[chiave] ? 'vista' : ''}" href="${href}">
      <span class="num" aria-hidden="true">${n}</span>
      <span class="corpo"><span class="tit">${tit}</span><span class="desc">${desc}</span>
      <span class="stato ${v[chiave] ? '' : 'vuoto'}">${v[chiave] ? fraseVisita(v[chiave]) : 'Non ancora aperta'}</span></span>
      <span class="freccia">${FRECCIA}</span></a>`;
  app.innerHTML = `
    <a class="indietro" href="${HOME_UMS}">${INDIETRO} Una Mano Spensierata</a>
    <header class="hero">
      <div class="kicker righe centro">Linguistica Italiana · a.a. 2026/27</div>
      <h1>Materiali e laboratorio<span class="seconda">di scrittura</span></h1>
      <p class="sottotitolo">Scegli un materiale. Nei tre percorsi di scrittura trovi prima la lezione e poi l'attività in aula; gli esercizi a casa hanno una sezione dedicata.</p>
      <div class="meta" style="justify-content:center"><span class="chip">Prof.ssa Beatrice Perrone</span><span class="chip">LM-85bis UniMC</span></div>
    </header>

    <section class="sezione">

/* ================= GISCEL ================= */
function giscel(){
  segnaVisita('giscel');
  const NUM = ['uno','due','tre','quattro','cinque','sei','sette','otto','nove','dieci'];
  const corpo = `
    <div class="richiamo"><strong>Documento originale e accompagnamento</strong><p>Il testo integrale si legge sul sito ufficiale GISCEL. La mappa, i casi e le domande qui sotto sono materiali didattici di accompagnamento: non fanno parte del documento.</p>
      <div class="azioni" style="margin-top:14px"><a class="btn btn-navy btn-piccolo" href="${GISCEL_URL}" target="_blank" rel="noopener">Leggi il testo integrale sul sito GISCEL ↗</a></div></div>
    <div class="testo-lungo">
      <h2 style="margin-top:40px">1. Collocare il documento</h2>
      <p>Il GISCEL si costituisce nel 1973 nell’ambito della Società di Linguistica Italiana. Le Dieci tesi sono un documento collettivo approvato a Roma il 26 aprile 1975.</p>
      <p>Per leggere un documento storico, distingui tre piani: che cosa afferma, quale problema affronta nel proprio tempo, quale domanda suggerisce al lettore di oggi. I riferimenti all’«oggi», i dati e le formulazioni del testo vanno collocati nel 1975, senza assumerli automaticamente come descrizioni attuali o indicazioni diagnostiche.</p>
      <h2 style="margin-top:40px">2. Orientarsi nelle dieci tesi</h2>
      <p>I titoli brevi e le frasi seguenti sono parafrasi di orientamento. Leggi ciascuna tesi per intero nella fonte prima di discuterla.</p>
    </div>
    <div class="tesi">${GISCEL_TESI.map(([n, t, s], i) => `<article><span class="rom">${n}</span><h3>${esc(t)}</h3><p>${esc(s)}</p><a href="${GISCEL_URL}#${NUM[i]}" target="_blank" rel="noopener">Leggi la tesi ${n} ↗</a></article>`).join('')}</div>
    <div class="richiamo"><strong>Attenzione alla struttura</strong><p>La tesi VIII contiene a sua volta dieci principi. Distingui il numero della tesi da quello del principio quando prendi appunti: per esempio, VIII.5.</p></div>
    <div class="testo-lungo">
      <h2 style="margin-top:40px">3. Leggere con una domanda</h2>
      <p>Lavora in coppia su una tesi. Uno studente individua un’affermazione; l’altro cerca nel testo il passaggio che la sostiene. Poi scambiate i ruoli.</p>
      <ol><li>Quale problema viene messo a fuoco?</li><li>Quali ragioni vengono date? Dove le riconosci nel testo?</li><li>Quale osservazione in classe ti servirebbe per discutere quel problema?</li><li>Quale domanda resta aperta dopo la lettura?</li></ol>
      <p>Nel confronto separa ciò che il documento dice dalla tua interpretazione e dalla proposta che vuoi sperimentare.</p>
      <h2 style="margin-top:40px">4. Quattro casi per la scuola primaria</h2>
      <p style="color:var(--sub)">Situazioni verosimili costruite per questa lezione. Gli svolgimenti sono proposte possibili, da confrontare e motivare; non sono citazioni GISCEL né protocolli di valutazione.</p>
    </div>
    ${GISCEL_CASI.map((c, i) => `<section class="caso"><div class="kicker">${esc(c.liv)}</div><h3 style="margin-top:6px">${i + 1}. ${esc(c.t)}</h3><blockquote>${esc(c.testo)}</blockquote>
      <p style="margin:0"><strong>Il compito.</strong> ${esc(c.compito)}</p>
      <p style="margin:8px 0 14px;font-size:.88rem;color:var(--sub)">Rileggi le tesi ${esc(c.ref)} nella <a href="${GISCEL_URL}" target="_blank" rel="noopener">fonte originale ↗</a>.</p>
      <details class="apri"><summary>Confronta con una possibile proposta</summary><div><p style="margin:0">${esc(c.risposta)}</p><p style="margin:0"><strong>Che cosa osservare.</strong> ${esc(c.osserva)}</p></div></details></section>`).join('')}
    <div class="testo-lungo">
      <h2 style="margin-top:40px">5. Dal caso a una piccola progettazione</h2>
      <p>Scegli uno dei casi e prepara una proposta di 20 minuti. Non occorre risolvere ogni difficoltà: rendi chiari l’obiettivo e le evidenze da osservare.</p>
      <ol><li><strong>Punto di partenza:</strong> quali elementi conosci e quali devi ancora raccogliere?</li><li><strong>Obiettivo:</strong> quale azione linguistica vuoi che gli alunni imparino a compiere?</li><li><strong>Attività:</strong> chi parla, ascolta, legge e scrive? Per quale destinatario?</li><li><strong>Supporti:</strong> quali esempi, immagini, riletture o lavori in coppia rendono accessibile il compito?</li><li><strong>Osservazione:</strong> quale produzione raccogli? Che cosa ti farebbe modificare la proposta?</li></ol>
    </div>
    <details class="apri" style="margin-top:16px"><summary>Un esempio di obiettivo osservabile</summary><div><p style="margin:0">Per il caso della relazione di scienze: «Al termine del confronto con una coppia di lettori, il gruppo sostituisce tre riferimenti poco chiari con informazioni ricavate dall’esperimento e spiega le proprie scelte». Si confrontano prima versione, domande dei lettori e revisione. Non basta contare le correzioni: occorre capire se il testo consente di ricostruire il procedimento.</p></div></details>
    <div class="testo-lungo">
      <h2 style="margin-top:40px">6. Discussione conclusiva</h2>
      <ul><li>Quale tua abitudine di correzione metteresti alla prova, e come?</li><li>Che differenza c’è tra riconoscere ciò che un alunno sa già e progettare ciò che deve ancora imparare?</li><li>Quali evidenze cercheresti prima di dire che un’attività ha funzionato?</li><li>Come collegheresti uno dei casi al lavoro su e-mail, riassunto o argomentazione?</li></ul>
    </div>
    <details class="apri" style="margin-top:16px"><summary>Controlla la tua lettura</summary><div><p style="margin:0">Prima di chiudere, prova a distinguere una critica ai risultati da una critica agli obiettivi, a riconoscere la struttura della tesi VIII e a motivare un intervento didattico citando una tesi pertinente. Se non trovi il passaggio che sostiene la tua interpretazione, riapri il documento.</p></div></details>`;
  app.innerHTML = `
    <a class="indietro" href="#">${INDIETRO} Materiale aggiuntivo</a>
    <div class="kicker" style="margin-top:26px">Materiale aggiuntivo per l'esame · GISCEL</div>
    <h1>Le tesi <i>GISCEL</i></h1>
    <p class="sottotitolo">Leggere un documento sull’educazione linguistica e usarlo per interrogare le scelte didattiche nella scuola primaria.</p>
    <div class="meta"><span class="chip">Testo del 1975</span><span class="chip">Lezione guidata</span><span class="chip">Casi e discussione</span></div>
    <div class="barra"><span class="kicker" style="letter-spacing:.2em">Lezione guidata</span><button type="button" class="btn btn-chiaro btn-piccolo" id="stampa">${STAMPA_ICO} Stampa</button></div>
    ${corpo}`;
  document.getElementById('stampa').onclick = () => {
    const d = document.createElement('div'); d.innerHTML = corpo;
    d.querySelectorAll('details').forEach(x => x.setAttribute('open', ''));
    d.querySelectorAll('.azioni').forEach(x => x.remove());
    stampa(`<div class="p-kick">Materiale aggiuntivo per l'esame · GISCEL</div><h1>Le tesi GISCEL</h1><p class="p-sub">Fonte: ${GISCEL_URL}</p>` + d.innerHTML);
  };
}

/* ================= percorsi della pagina ================= */
function rotta(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [a, b] = h.split('/');
  if (!a) home();
  else if (a === 'canale-scritto') canaleScritto();
  else if (PERCORSI[a]) percorso(a, b);
  else if (a === 'casa') casa();
  else if (a === 'giscel') giscel();
  else if (a === 'consegna') consegna();
  else home();
  if (!visore.hidden) chiudiVisore();
  scrollTo(0, 0);
}
addEventListener('hashchange', rotta);
rotta();
})();

</script>
